{% extends "base.html" %}

{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 540px; margin: 3rem auto; text-align: center; padding: 2.5rem 1.5rem;">
  <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--status-danger);">
    {{ code }} — {{ title }}
  </h1>
  <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.5;">
    {{ message }}
  </p>

  <div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
      Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
